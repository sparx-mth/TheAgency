# Doorway positions for the AWS RoboMaker hospital world, world-frame ENU
# metres (the frame /simple_drone/odom reports). Read by semantic_mapper_node,
# which punches a disk through the Voronoi skeleton at each one: an opening
# missing from this list is an opening the room segmentation cannot cut, and
# the two rooms it joins are reported as one.
#
# TWO SOURCES, MEASURED AGAINST THE GROUND-TRUTH MAP (hospital.npz, interior
# isolated with grid_regions.largest_enclosed_region -- without that the
# outdoor space wraps the building and no cut can sever anything):
#
#   flown 24 alone   23 rooms, largest 189204 cells = 41% of the floor
#   portals 33 alone 27 rooms, largest  58675 cells = 13%
#   both (this file) 29 rooms, largest  58920 cells = 13%
#
# The hand-tuned 24 are what the sjtu_project stack flew (DEFAULT_DOOR_XY_FLAT
# in semantic_mapper_node.py, branch detect_navigate_nadav) and they are not
# enough on their own -- they leave two fifths of the hospital as one room.
# The rest are the lintel-band portals from hospital_regions.yaml, which is
# co-registered with hospital.npz in this same frame and is regenerated by
# tasks/mapping/gazebo_world_occupancy/build_regions.py. Portal entries closer
# than 0.75 m to a flown door were dropped as duplicates.
#
# Regenerate after rebuilding hospital_regions.yaml; the flown block is
# hand-tuned and should be carried across by hand.
