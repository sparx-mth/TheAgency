# ros1_bridge parameter_bridge topics for the FALCON <-> SJTU Gazebo loop.
#
# One entry per topic, and the direction of each is set by who publishes, not
# by this file -- parameter_bridge bridges every entry both ways.
#
#   ROS2 -> ROS1: depth image, odometry, bumper (the sensors), /clock, and the
#                 scene-graph task's claim on cmd_vel
#   ROS1 -> ROS2: cmd_vel and takeoff (the actuation), and the BEV grid
#
# QoS is the trap here, verified live rather than assumed: gazebo_ros_camera
# and the drone plugin publish RELIABLE / VOLATILE (checked with
# `ros2 topic info -v` on the running sim -- the old stack's comments warn the
# same publishers are sometimes best_effort in other builds, and a mismatch is
# not an error, it is silently zero data).
#
# camera_info is deliberately NOT bridged: FALCON reads intrinsics from
# rosparam (/uav_model/sensing_parameters/*), which bspline_follower.launch
# sets to the corrected 600x600 / fx 390.64 model.
#
# /clock is bridged ROS2 -> ROS1 so the ROS1 side CAN run on sim time when
# use_sim_time is set (the hospital world runs below real-time, ~0.88x idle and
# lower under FALCON's depth+plan load; a wall-clock schedule then runs ahead of
# the physics -- the dominant failure the Pegasus campaign fixed with the clock).
# Its publisher is BEST_EFFORT (verified live), so this subscriber MUST be
# best_effort too -- a reliable reader of a best_effort writer receives nothing.

topics:
  - topic: /clock
    type: rosgraph_msgs/msg/Clock
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

  - topic: /simple_drone/front_depth/depth/image_raw
    type: sensor_msgs/msg/Image
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: volatile

  - topic: /simple_drone/odom
    type: nav_msgs/msg/Odometry
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: volatile

  - topic: /simple_drone/cmd_vel
    type: geometry_msgs/msg/Twist
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: volatile

  - topic: /simple_drone/takeoff
    type: std_msgs/msg/Empty
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: volatile

  # Ground-truth contact from the Gazebo collision plugin (gazebo_msgs is
  # available on both ROS 1 and ROS 2 here). The follower reads this to back out
  # of a wall the instant it touches -- far more reliable than inferring a wedge
  # from a stalled pose, because a velocity-commanded aircraft grinding on a wall
  # still jitters enough to look like it is moving. Publisher is RELIABLE.
  - topic: /simple_drone/bumper_states
    type: gazebo_msgs/msg/ContactsState
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: volatile

  # The BEV grid from bev_publisher_node (enable_bev:=true in
  # exploration.launch; off by default). ROS1 -> ROS2, consumed by the
  # scene-graph task at tasks/mapping/scene_graph. The ROS1 publisher is
  # LATCHED, and transient_local is the ROS2 spelling of that: the scene-graph
  # node starts whenever it starts, and a late joiner still receives the last
  # grid instead of nothing until the map next changes (the node skips
  # unchanged republishes, so "next change" can be a long wait). Depth 1
  # because only the latest grid means anything. The companion
  # /falcon/bev_2d_conf stays unbridged until something on the ROS2 side
  # reads it -- bridge only what has a consumer.
  - topic: /falcon/bev_2d
    type: nav_msgs/msg/OccupancyGrid
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: transient_local

  # Who is allowed to fly the aircraft. ROS2 -> ROS1, published by the
  # scene-graph task (tasks/mapping/scene_graph) and read by our
  # bspline_follower, which publishes NOTHING on cmd_vel while this reads true
  # -- the hand-off for a visual final approach onto a found target. Two
  # writers on one cmd_vel topic at 50 Hz is not a hand-off, it is a fight, so
  # the mute is the whole mechanism.
  #
  # LATCHED on the ROS2 side, and transient_local is that spelling: FALCON's
  # container is restarted independently of the ROS2 stack, and a VOLATILE
  # reader of a transient_local writer receives nothing at all until the
  # writer's next change -- which, for a flag that only moves twice a mission,
  # can be the whole flight. Depth 1 because only the newest verdict means
  # anything; a backlog of stale claims must never keep the aircraft muted.
  #
  # The claim is a LEASE: the publisher must republish true at ~1 Hz, or the
  # follower's ~external_ctrl_timeout_s -- 5 s, whose default lives in
  # falcon_sjtu/adapter/launch/bspline_follower.launch -- expires it and
  # takes the aircraft back. That watchdog exists for exactly this bridge:
  # if the ROS2 claimant dies, its last latched true is all that survives
  # here.
  - topic: /scene_graph/external_ctrl
    type: std_msgs/msg/Bool
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: transient_local

