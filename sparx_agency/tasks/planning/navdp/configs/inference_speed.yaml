# NavDP inference-speed profile
# ==============================
# Model-level knobs that trade a little accuracy for runtime speed, WITHOUT
# changing the algorithms. Organized by COST TO CHANGE -- read the tier header
# before touching a knob, because it answers "do I need to re-optimize TRT?":
#
#   TIER 1  runtime   : takes effect on the next server start.  NO TRT rebuild.
#   TIER 2  rebuild   : needs ONNX re-export + build_engine + bench.  NO retrain.
#   TIER 3  retrain   : baked into the trained weights.  LOCKED (enabled: false).
#
# Per-decision cost is ~71% the 10x denoise loop and ~29% encoder+critic, so the
# TIER-1 `num_inference_steps` knob is by far the highest-leverage change.
#
# WIRING STATUS: this file DEFINES the control surface. It is read on the tasks
# side (server) and passed as plain values into the core policy, so `core` stays
# numpy-only. A knob only takes effect once its consumer is wired -- see the
# `wired` flag on each tier. Nothing here is live until then; values are targets.

schema_version: 1

# ===========================================================================
# TIER 1 -- RUNTIME ONLY.  No TRT rebuild. Edit -> restart the server.
# ===========================================================================
runtime:
  wired: true         # LIVE: read by server/navdp_trt_server.py -> NavDPTRTPolicy

  # Diffusion denoise steps per decision. Trained at 10 (DDPM). Fewer steps is a
  # ~linear cut of the 71% denoise budget (rough end-to-end):
  #   10 -> 1.00x (baseline)   5 -> ~1.55x   4 -> ~1.74x   2 -> ~2.5x
  # NOTE: values < 10 REQUIRE sampler: ddim (DDPM cannot skip timesteps).
  num_inference_steps: 4        # try 4 (with sampler: ddim); 10 = bit-faithful baseline

  # Sampler used to run `num_inference_steps`:
  #   ddpm : trained default; MUST use 10 steps (stochastic, bit-faithful).
  #   ddim : deterministic; subsamples the 10 trained timesteps -> allows < 10. [implemented]
  #   dpm  : DPM-Solver (fewer steps per quality) -- NOT yet implemented; use ddim.
  sampler: ddim                  # ddpm | ddim

  # Startup safety gate (LIVE): when enabled, the server compares the configured
  # reduced-step sampler to the 10-step DDPM gold BEFORE serving and REFUSES to
  # start if the trajectory drift exceeds max_chosen_l2 -- so a too-aggressive K
  # never reaches the drone. `chosen_L2` is the robust signal (catches a
  # catastrophically low K even on random inputs, e.g. K=2 blew up to ~14); set
  # `frames` to a real-RGB-D npz for a meaningful check of subtle quality.
  # No-op for sampler: ddpm. For a full offline report use benchmark.validate_steps.
  validate_against_frozen_gold:
    enabled: false
    max_chosen_l2: 5.0     # refuse to serve if drift vs the 10-step gold exceeds this
    scenarios: 16          # quick check size (adds a few seconds to startup)
    frames: null           # real-RGB-D npz for a trustworthy check; null -> random smoke

# ===========================================================================
# TIER 2 -- REQUIRES ONNX RE-EXPORT + TRT REBUILD (build_engine + bench).
#           Same weights, NO retrain. `bench` re-validates numerics on rebuild.
# ===========================================================================
rebuild:
  wired: false        # `sample_num` currently comes from io_spec.N (static)

  # Candidate trajectories denoised in parallel, then ranked by the critic.
  # Baked into the engine's STATIC batch (io_spec.N), so changing it needs a
  # re-export + rebuild. Fewer = faster denoise + critic, but the critic has
  # fewer routes to choose from (navigation-quality tradeoff; needs task eval).
  sample_num: 16                 # try 8; MUST re-export ONNX + rebuild engines

  # Encoder frame-caching: the 8 RGB memory frames are a sliding window, so run
  # the ViT only on the NEW frame and reuse cached tokens for the other 7 (the
  # Q-Former still runs over all). ~1.2x, no retrain -- needs the encoder graph
  # split into (per-frame ViT) + (Q-Former), i.e. a re-export.
  encoder_frame_cache: false     # not yet implemented

# ===========================================================================
# TIER 3 -- REQUIRES RETRAINING.  LOCKED. These are baked into the trained
#           weights; changing them needs a NEW checkpoint. Listed for planning
#           only. Keep enabled: false -- we are NOT changing these for now.
# ===========================================================================
retrain:
  enabled: false                 # master lock for this whole tier

  predict_size:                  # trajectory horizon (waypoints the head emits)
    enabled: false
    trained_value: 24
    proposed_value: 12           # shorter look-ahead; moderate speedup; retrain

  memory_size:                   # RGB memory frames fed to the encoder
    enabled: false
    trained_value: 8
    proposed_value: 4            # less temporal/obstacle memory; retrain

  token_dim:                     # transformer width
    enabled: false
    trained_value: 384

  decoder_layers:                # denoise decoder depth
    enabled: false
    trained_value: 16

  backbone:                      # encoder ViT size
    enabled: false
    trained_value: dinov2_vit_s
    proposed_value: dinov2_vit_t # smaller/faster encoder; retrain

  distillation:                  # consistency / few-step student model
    enabled: false               # highest ceiling (~3.4x) but the biggest project
    proposed_steps: 2
