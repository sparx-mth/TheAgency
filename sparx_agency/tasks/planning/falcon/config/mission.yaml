# ============================================================================
# mission.yaml -- every parameter run_object_mission.sh needs, in one place.
#
# Read on the HOST by config/mission_config.py and fanned out to the three worlds
# the mission spans: host/docker values, roslaunch <arg> values, and the ROS2
# detector sidecar's params.
#
# Precedence (highest first):
#   1. the command line   ./run_object_mission.sh hospital random land_range_m:=0
#   2. an environment var NAV_MODE=hybrid ./run_object_mission.sh
#   3. THIS FILE
#   4. the built-in default in run_object_mission.sh / the launch file
#
# So a value here is a default you can always override for one run without editing.
# Comment a key out (or delete it) to fall back to the built-in default.
#
# Every key is validated: an unknown key is a hard error with a suggestion, never a
# silent no-op. Keys under launch: are checked against the <arg> names that
# adapter/launch/object_mission.launch actually declares.
#
# Use a different file for one run:  CONFIG_FILE=/path/to/other.yaml ./run_object_mission.sh
# ============================================================================

# ── The mission itself ──────────────────────────────────────────────────────
mission:
  map: office                 # maps/<map>.yaml -- the FALCON environment
  selection_mode: gui         # gui = click a row in the object list | random
  nav_mode: astar             # fallback | hybrid | astar | combination | navdp
                              #   fallback : A* flies the route, NavDP rescues a boxed-in A*
                              #   hybrid   : A* on easy legs, NavDP through hard turns/doorways
                              #   astar    : pure A* (the only mode needing no NavDP server)
                              #   combination: always-on A*+NavDP fusion
  seed: -1                    # >=0 makes selection_mode:=random reproducible

# ── YOLO-World detector (the host sidecar) ──────────────────────────────────
detector:
  model: x                    # s | m | l | x  (picks yolo_world_<model>.*.engine)
  weights_dir: /home/user/Downloads     # holds yolov8<model>-worldv2.pt
  conf_thresh: 0.1            # detection confidence floor; below this a detection
                              #   is ignored, so the object is never confirmed and
                              #   the mission lands by A* alone (see land_at_goal)
  init_target: gun            # placeholder prompt before you select; the director
                              #   re-prompts the detector with the chosen label
  # engines_dir: /path/to/engines       # default: yolo_world_trt/engines/<target_tag>
  # text_weights: /path/to/yolov8x-worldv2.pt   # default: <weights_dir>/yolov8<model>-worldv2.pt

# ── Where the object catalog lives ──────────────────────────────────────────
paths:
  # The room mapper writes this on the host; run_falcon.sh bind-mounts the DIRECTORY
  # into the container at the same path, so host and container agree.
  objects_dir: /home/user/jetson-containers/data/captures/latest_room_map
  # objects_file: /path/to/objects.json   # default: <objects_dir>/objects.json

# ── Anything object_mission.launch declares as an <arg> ─────────────────────
# Free-form passthrough: every key here is forwarded as key:=value. Validated
# against the launch file, so a typo fails loudly instead of doing nothing.
launch:
  # -- Landing --
  land_range_m: 1.0           # visual land distance (depth). 0 disables the visual
                              #   land and relies on arrival-land alone
  land_at_goal: true          # land on reaching the coordinate goal unconfirmed
  arrive_radius_m: 0.6        # how close to the goal counts as "reached"
  arrive_land_confirm_ticks: 5
  land_confirm_ticks: 3

  # -- Detection gate (how sure we must be it IS the object) --
  min_score: 0.15             # score floor for the object_approach confirmation gate
  n_confirm: 3                # consecutive hits needed before it counts as confirmed

  # -- Visual servo --
  target_range_m: 0.8         # hover standoff once locked on
  lock_mode: detector_tracker
  closure_mode: multi_axis
  force_mode: fixed

  # -- Nav --
  controller: waypoint        # waypoint | multi_axis | pure_pursuit | roll_assist
                              #   NOTE: real_drone.launch defaults to roll_assist, but the
                              #   object mission has always pinned waypoint. Set it here.

  # -- WAYPOINT-controller speeds (the two dials for `controller: waypoint`) --
  # EVERY SPEED DIAL IN THIS FILE, SI throughout, all rate-per-second:
  #
  #     vel_x                m/s    forward flight,  normal navigation   <- here
  #     yaw_rate             rad/s  rotation,        normal navigation   <- here
  #     recovery_back_speed  m/s    backward flight, lost-loc recovery   <- recovery block
  #     recovery_turn_rate   rad/s  rotation,        lost-loc recovery   <- recovery block
  #
  # There is no recovery FORWARD speed and no normal-navigation BACKWARD speed, and
  # neither is an oversight: recovery only ever retreats (it is getting away from
  # whatever swallowed the tag), and the follower only ever advances (it turns to
  # face a waypoint rather than reversing toward it).
  # The recovery persist stage has no speed of its own either, on purpose: it
  # CONTINUES the move that was already in flight, so it reuses whichever of the two
  # navigation dials above was live at the moment the pose went cold.
  # (controller: pure_pursuit ignores vel_x/yaw_rate entirely and uses
  # pp_cruise_speed / pp_max_yaw_rate below -- the trap documented under those keys.)
  #
  # The one-axis follower never translates and rotates at the same time: every
  # command is EITHER a pure forward advance OR a pure in-place turn. So these two
  # are fully independent -- vel_x is the speed of every straight leg, yaw_rate the
  # speed of every corner. Nothing blends them.
  #
  # yaw_rate is not a continuous controller: the follower turns in discrete bursts
  # (pulse -> settle -> re-measure), and yaw_rate is the rate DURING a burst. Raising
  # it makes each burst sweep further per tick, so a big turn finishes in fewer
  # bursts; lowering it turns more gently but spends longer stopped. 0.7 rad/s at the
  # 10 Hz control rate is ~4 deg per tick.
  #
  # These are IGNORED under controller: pure_pursuit, which has its own pair below
  # (pp_cruise_speed / pp_max_yaw_rate) -- that is the trap documented there.
  vel_x: 0.25                 # m/s, forward flight speed on every straight leg
  yaw_rate: 0.7               # rad/s, rotation speed during a turn burst

  # -- Pure-pursuit yaw force (only used when controller: pure_pursuit) --
  # This is the turn-force dial. Pure pursuit sets wz = speed * curvature and clips
  # it at pp_max_yaw_rate; with the cruise/lookahead defaults that clip is reached
  # beyond ~37 deg of angle to the lookahead, so EVERY real left/right turn commands
  # exactly this rate. The XTEND converter scales it as |wz|/0.65*1000:
  #
  #   0.60 rad/s -> yaw axis 923 of 1000  (92% of full thrust -- turned too hard)
  #   0.45 rad/s -> yaw axis 692
  #   0.35 rad/s -> yaw axis 538
  #
  # Lowering it ONLY softens turns big enough to hit the cap; gentle corrections
  # (below ~27 deg) are already under it and are unchanged. If the turns are still
  # too sharp, the other lever is a longer pp_base_lookahead (0.6) -- that lowers
  # the curvature itself rather than clipping the result, so the whole turn is
  # rounder instead of just slower.
  pp_max_yaw_rate: 0.35       # rad/s cap == the force of a left/right turn
  pp_yaw_rate_smoothing: 0.3  # EMA into that rate (lower = softer onset, slower to commit)

  # -- Pure-pursuit forward speed (only used when controller: pure_pursuit) --
  # This is the TOP speed too: the profile only ever scales cruise DOWN (goal
  # slowdown, curvature), so pp_max_speed never binds and this alone decides how
  # fast the drone flies.
  #
  # IT IS NOT vel_x. vel_x (0.25) is the WAYPOINT follower's speed; pure pursuit
  # ignores it, because the node's fallback to vel_x is shadowed by the launch
  # always setting pp_cruise_speed. So switching to pure_pursuit silently sped the
  # drone up 0.25 -> 0.30 while looking like a pure controller swap. Changing vel_x
  # here does nothing while pure_pursuit is selected -- change THIS.
  #
  # And 0.3 does not mean what it means for the waypoint follower. Holonomic pure
  # pursuit commands forward, lateral AND yaw at the same time (the bridge sends
  # them as one set_axes), but the platform's translation calibration -- 0.3 m/s ==
  # axis 400 -- was measured on forward ALONE. Blend three axes and the drone
  # covers ground faster than the number claims, so the number has to come down:
  #
  #   cruise 0.30, 30 deg off the lookahead -> forward 346 + lateral 200 + yaw 538
  #   cruise 0.20, 30 deg off the lookahead -> forward 231 + lateral 133 + yaw 538
  pp_cruise_speed: 0.2        # m/s; nominal AND top speed under pure_pursuit

  # -- Pure-pursuit ROLL (only used when controller: pure_pursuit) --
  # true  = holonomic: the velocity points AT the lookahead, so the drone CRABS
  #         sideways (roll) as well as yawing.  vy = speed * sin(alpha)
  # false = unicycle:  vx = speed straight ahead, vy = 0 ALWAYS, yaw does all the
  #         turning.  <- what we fly
  #
  # Roll is the one axis pure pursuit never bounds. multi_axis caps it
  # (mx_lateral_speed_max 0.25) and roll_assist caps it (ra_lateral_speed_max 0.25);
  # pure_pursuit has NO lateral cap, so roll just grows with cruise -- past ~60 deg
  # off the lookahead the drone is mostly sliding sideways rather than flying
  # forward (at 90 deg: forward axis 0, roll axis 267). Sideways is the worst
  # direction to move blind here, because the camera and the BEV map both look
  # FORWARD: a crab translates the drone into space nothing has seen.
  # There is no separate roll force to turn down -- roll comes off pp_cruise_speed,
  # the same dial as forward -- so it is either capped in code or switched off; this
  # switches it off. Tight corners are still safe without the crab because
  # pp_curvature_speed_factor already cuts the speed hard exactly where the angle is
  # large. Expect cornering to FEEL different: it turns rather than slides.
  pp_holonomic: false
  cruise_z: 1.0               # flight altitude (m); the BEV weight peak (bev_z_peak) follows it

  # -- How wide "in front of the next point" is (the ADVANCE gate) --
  # NOT a fixed angle. The gate is predictive: the drone starts flying as soon as
  # going straight would still pass within yaw_acquisition_radius of the waypoint,
  # so the accepted heading error is asin(radius / distance) -- wider up close,
  # narrower far away -- capped by yaw_acquire_max_deg and floored by the ~11.5 deg
  # the platform physically cannot improve on (half a minimum burst plus its coast).
  #
  #   radius 0.20 m  ->  0.5 m: 23.6 deg | 1.5 m: 11.5 deg | 3.0 m: 11.5 deg
  #   radius 0.51 m  ->  0.5 m: 35 deg   | 1.5 m: 20.0 deg | 3.0 m: 9.8 deg
  #
  # KEEP THIS BELOW the waypoint acquisition radius (pos_acquisition_radius, 0.3).
  # The gate only promises to pass within THIS distance of the waypoint, so a
  # tolerance wider than the capture radius means the drone sails past waypoints
  # without ever entering the radius that counts as reaching them: they stop being
  # acquired at all, and are only retired once they are 100 deg behind
  # (passed_bearing_deg). 0.51 (a ~20 deg gate) was tried on the real drone and
  # flew WORSE in exactly that way, hence back at 0.20.
  # Note yaw_acquire_max_deg is NOT the knob here: it only binds inside ~0.3 m, so
  # changing it alone does almost nothing at cruise.
  yaw_acquisition_radius: 0.2    # cross-track tol (m); MUST stay < pos_acquisition_radius
  yaw_acquire_max_deg: 35.0      # hard cap the gate will ever accept
  # The matching decision for the NEXT leg once a waypoint is retired: glide on if
  # its bearing is within this, else brake and re-align. Keep it in step with the
  # gate above. RADIANS, not degrees. 0.25 is the follower's own long-standing
  # default; it is declared here only so it is tunable without editing the launch.
  skip_yaw_thresh: 0.25          # rad; 0.25 = 14.3 deg

  # -- GO gate: nothing reaches the drone until you say so --
  # false = the whole pipeline runs (BEV, A*, detector, selection) but NOT ONE velocity
  # command is sent until GO, so you can launch before/while taking off by hand without
  # the stack fighting you. Press GO (or g) in the director window, or:
  #   rostopic pub -1 /mission/go std_msgs/Bool "data: true"
  # Set true to fly as soon as an object is selected, as before the gate existed.
  start_go: false
  go_topic: /mission/go
  zero_on_close: true         # one zero twist when GO->false (a stop, not a hold)

  # -- Lost-localization recovery: what to do when the drone stops knowing where it is --
  # The AprilTag pose only exists while a tag is IN VIEW. Walk behind a pillar and
  # /xtend/localization simply stops publishing -- but every consumer keeps its last
# value, so the drone happily keeps flying toward where it was seconds ago. This
  # watches the pose and, when it goes cold, takes the drone off the follower:
  #   persist  -> finish the move that was interrupted (see below)
  #   stale_s  -> STOP and hold (cheap, instantly undone; ~2 frames at 7 Hz)
  #   ladder_s -> back up, settle, back up, settle, climb, settle, climb, settle,
  #               then a slow 360 sweep looking for any tag
  #   nothing worked -> land (stop -> land -> disarm)
  # Any fresh pose at any point abandons the ladder and hands the drone straight back.
  # The gap between the two thresholds is the point: a routine one-frame tag dropout
  # must never provoke the ladder's metre-scale blind retreat. It costs at most the
  # persist below -- a fraction of a second of the move that was already in flight.
  recovery_enabled: true
  recovery_stale_s: 0.3       # pose this old (s) => STOP. Lower = twitchier.
  recovery_ladder_s: 1.0      # ...and still this old => start manoeuvring. > stale_s.
  #
  # Persist: what to do in the INSTANT the tag goes, before any of the above. Most
  # dropouts are caused by the move that was under way and are undone by finishing
  # or reversing it -- and at that instant we still know which move it was.
  #   mid-TURN    -> keep turning, same direction, at the navigator's own rate. The
  #                  tag left the frame because we rotated it out, so the next one is
  #                  often already swinging in; stopping dead strands the camera
  #                  pointed at the one heading we know is empty. Losing it during
  #                  the settle BETWEEN two yaw bursts counts as mid-turn -- the
  #                  drone is stationary but is still in a turn.
  #   mid-ADVANCE -> the opposite: give the metres back. Losing a tag while flying at
  #                  it means we flew too close, so continuing is the one thing that
  #                  cannot help. Reverses at the speed we advanced at, capped by
  #                  recovery_back_speed.
  # Either way the drone then holds still and looks, and if the pose comes back the
  # recovery never happens at all. If it does not, the ladder runs exactly as before
  # -- delayed by the persist plus the look, never replaced.
  recovery_persist_enabled: true
  recovery_persist_turn_s: 0.6    # ~3 of the follower's commands' worth of turn
  recovery_persist_back_s: 0.6    # at ~0.3 m/s cruise, ~0.18 m given back
  #
  # Retreat: the FIRST rung, and the most likely to work -- we were standing
  # somewhere with a tag in view seconds ago, so go back there. Worth enough
  # distance to actually leave the spot that lost the tag; too short and the drone
  # just sits in the same bad place. Unlike the climb, this axis IS what the thrust
  # scale was calibrated against (0.3 m/s = the reference point), so these numbers
  # mean roughly what they say: 0.30 x 1.5s = ~0.45 m per rung, run twice = ~0.9 m.
  # NOTHING checks what is behind the drone (the map is forward-looking and is
  # starved of poses while lost); it is only safe because it retraces ground just
  # flown, so keep the total inside how far the drone has actually come.
  recovery_back_speed: 0.30       # m/s, backward flight speed during recovery
  recovery_back_duration_s: 1.5   # per rung; 2 rungs by default
  # Climb rungs need the platform to honour linear.z, which on XTEND depends on which
  # Twist converter is running: online_nav_bridge's in-process one honours it, while
  # the standalone xtend_twist_to_cmd_nav.py drops it unless started with
  # --allow-multi-axes (a dropped axis is silent -- the drone just does not rise).
  # Set false if the climb cannot work: the ladder then skips those rungs rather than
  # spending ~5s going nowhere.
  recovery_climb_enabled: true
  #
  # MIND THE CEILING. recovery_climb_speed is a THRUST dial, not a speed: the vertical
  # axis is scaled by the FORWARD calibration (|v|/0.3*400) and there is no vertical
  # constant anywhere -- XTEND climbs far harder at a given number than it flies
  # forward at it. The height actually gained is well ABOVE speed*duration, because
  # commands are hold-style and the drone keeps rising through the stop, and nothing
  # in this stack measures altitude to catch the overshoot. (0.20/1.0 put the drone
  # into the ceiling from cruise_z 1.0; these are ~6x gentler.) Two rungs run, each
  # with its own overshoot -- budget for both against your real headroom, and raise
  # these only against a climb you have actually measured.
  recovery_climb_speed: 0.08       # thrust dial (m/s nominal), NOT a real climb rate
  recovery_climb_duration_s: 0.2   # per rung; 2 rungs by default
  # Which way the final 360 sweeps: left | right. RIGHT by default -- field-tested:
  # it is the side that actually re-acquires a tag on this airframe. The sweep is a
  # search, so the direction that finds one soonest is the whole point of it.
  recovery_turn_dir: right
  # How hard it sweeps. RAD/S, the same unit as yaw_rate above, so the airframe's
  # two rotation dials can be read against each other directly.
  # This number has a FLOOR as well as a ceiling, and the floor is the one that
  # bites: too low and the commanded yaw never overcomes the airframe, so the drone
  # barely rotates -- and a sweep that never swept looks exactly like a sweep that
  # found nothing. Kept under yaw_rate all the same, because motion blur is what
  # defeats a tag detection.
  recovery_turn_rate: 0.6        # rad/s, rotation speed during the recovery sweep

  # -- Windows (all need a display) --
  viewer: false                # target-lock HUD
  bev_viewer: true            # interactive BEV window
  publish_overlay: false

  # -- Debug logging (ONE switch for the whole stack) --
  # false = console shows real events only: plans, replans, squeezes, failures.
  # true  = adds the chatty per-cycle traces (per-waypoint potential-field
  #         pushes, per-cycle waypoint counts) used when tuning the corrector or
  #         the simplifier. They are verbose enough to bury everything else, so
  #         keep this off in flight and turn it on for a tuning session.
  # To trace ONE subsystem, leave this false and set that flag alone on the
  # command line, e.g.:  ./run_object_mission.sh apf_debug:=true
  debug: false

  # -- Drone "thinking": the stack's own account of WHY it acted --
  # Every node narrates its decisions ("no route at 0.40m, flying a 0.25m
  # squeeze", "obstacle confidence 0.4 < 0.75, keeping the route and looking
  # again"). Two independent switches, BOTH OFF by default:
  #
  #   thinking_log     append every thought to one file for the run, so after
  #                    landing you can read what the planner was thinking rather
  #                    than having had to watch for it. Each node writes the file
  #                    itself, flushed per line, so a kill or a flat battery
  #                    still leaves the record. Costs no window and no display.
  #   thinking_window  the live "drone thinking" window beside the BEV map.
  #                    Needs a display, so leave it off for a headless Jetson
  #                    run -- the log above is the durable record either way.
  #
  # Under run_falcon.sh the log lands on the HOST in falcon/logs/ (the container
  # is --rm, so a log written inside it would die with the run). Set
  # thinking_log_path to choose the file yourself.
  thinking_log: false
  thinking_window: false
  # thinking_log_path: /falcon_logs/my_flight.log

  # -- Localization: must match what actually publishes your world pose --
  real_pose_topic: /xtend/localization
  real_pose_type: pose_stamped

  # -- Camera intrinsics: shared by the map AND the detector; keep them in sync --
  cam_fx: 322.6351083474948
  cam_fy: 323.3893307141174
  cam_cx: 242.06479658679714
  cam_cy: 90.03019076680604
  cam_width: 504
  cam_height: 294

  # ══════════════════════════════════════════════════════════════════
  # Below: the nav-stack parameters (A*, BEV, corrector, APF).
  # Defaults mirror the launch files exactly -- editing one here changes the
  # run; commenting it out falls back to the same value. See nav_stack.launch
  # for the full per-parameter reasoning.
  # ══════════════════════════════════════════════════════════════════

  # ---- A* planner -- route search, replanning, corner handling (30) ----
  #
  #   WALL STANDOFF, in three tiers. Read these four keys together:
  #
  #     inflate_radius_m 0.40   PREFERRED. What we fly whenever the map allows.
  #     inflate_floor_m  0.25   FLYABLE FLOOR. A pinch relaxes 0.40 -> 0.35 ->
  #                             0.30 -> 0.25 and flies the first rung that fits.
  #                             Below 0.25 is dangerous, so nothing flies there.
  #     probe_radius_m   0.10   DIAGNOSTIC ONLY, NEVER FLOWN. Re-derives the whole
  #                             route with almost no standoff purely to answer
  #                             "is this blockage even real?". A passage that only
  #                             opens at 0.10 was closed by noise, not by a wall.
  #     relax_step_m     0.05   granularity of the 0.40 -> 0.25 ladder.
  #
  #   Every replan restarts at 0.40, so a squeeze is never sticky. Do NOT lower
  #   inflate_radius_m to "make planning work" -- that gives up 0.40 everywhere,
  #   including the wide corridors where it was free. Let the ladder do it.
  #
  waypoint_spacing_m:            1.0
  inflate_radius_m:              0.35          # PREFERRED standoff (m); the drone CENTRE never plans closer than...
                                               # ...this to a confirmed obstacle. Relaxes toward inflate_floor_m ...
                                               # ...only when the map leaves no other route.
  unknown_blocked:               false
  unknown_cost:                  6.0           # keep above 1 + clearance_weight, else a route prefers gray to a ...
                                               # ...known-free cell that merely passes near a wall
  clearance_weight:              3.0           # SOFT wall avoidance: extra cost peaking at the lethal boundary, ...
                                               # ...fading to 0 clearance_margin_m beyond it. Rides corridor cent...
                                               # ...res when there is room, still plans a tight leg when there is...
                                               # ... not. 0 = binary free/blocked
  clearance_margin_m:            0.8
  lethal_confidence:             0.5           # BEV evidence an OCCUPIED cell needs to BLOCK. Below it the cell ...
                                               # ...costs soft_obstacle_cost instead, so single-frame depth speck...
                                               # ...le cannot make the map infeasible. 0 = every OCCUPIED blocks
  soft_obstacle_cost:            25.0
  inflate_floor_m:               0.25          # LOWEST FLYABLE standoff. The ladder stops here because below 0.2...
                                               # ...5 is genuinely dangerous -- it is the airframe's inscribed ra...
                                               # ...dius, not a tuning knob. Raise to 0.40 to disable relaxation.
  relax_step_m:                  0.05
  probe_radius_m:                0.10          # DIAGNOSTIC ONLY -- NEVER FLOWN, and not a 5th rung of the ladder...
                                               # ...Once every flyable rung has failed, the route is re-derived e...
                                               # ...nd to end at this standoff to ask whether the blockage is rea...
                                               # ...l. If a passage opens here it was closed by depth noise, not ...
                                               # ...a wall, so the stack holds and re-observes instead of declari...
                                               # ...ng itself boxed in. Map cells are never auto-cleared. 0 = off
  replan_relaxed_period_s:       4.0           # replan cadence at inflate_floor_m, rising linearly to replan_per...
                                               # ...iod_s at 0.40: less clearance = trust the route less
  los_smoothing:                 false         # now Douglas-Peucker thinning (shape-preserving), no longer the s...
                                               # ...tring-puller; safe to enable if you want fewer waypoints
  turn_penalty:                  0.3           # was 0.0; discourage zig-zag/staircase corners so the path needs ...
  heading_penalty_m:             1.5           # HEADING-AWARE A*: cost (in m of extra path) for a route that tur...
  connectivity:                  4           
  search_margin_m:               3.0         
  start_skip_m:                  0.5         
  goal_snap_radius_m:            2.0         
  min_free_cells_to_plan:        80            # SMART replanning (event-driven; the default). The committed rout...
  smart_replan:                  true        
  replan_corridor_radius_m:      1.0           # route-corridor half-width for the discovery relevance test (m)
  replan_min_new_cells:          60            # CHANGED corridor cells (new or flipped free<->occ) needed to consider an opportunistic replan
  replan_min_new_cells_any:      240           # changed cells ANYWHERE on the BEV (off-corridor changes can still change the best route); 0 disables
  replan_rotation_min_deg:       30.0          # yaw swing since the last commit/evaluation that re-evaluates the route (mid-turn or just finished); 0 disables
  replan_period_s:               7.0           # catch-all: re-evaluate this long after the last A* evaluation even with no other trigger; 0 disables
  replan_commit_min_s:           4.0           # keep flying a committed route at least this long before an oppor...
  replan_improve_frac:           0.15          # adopt a discovery candidate only if it is >= this fraction short...
  stop_on_blocked_plan_fail:     true          # on a confirmed obstacle with NO route around it, STOP (2-pt hold...
  replan_collision_confirm:      4             # consecutive colliding BEV frames before a collision replan (debo...
  plan_period_s:                 10.0          # Optional LEGACY mid-cycle replans: OFF so the trajectory stays f...
  replan_on_collision:           false       
  replan_on_bev:                 false         # Corner rounding: merge near-collinear vertices + chamfer moderat...
  corner_round:                  false       
  corner_merge_deg:              8.0           # drop interior vertices that turn less than this
  corner_max_turn_deg:           14.0          # corners gentler than this are already glide-able (pair with skip...
  corner_chamfer_max_deg:        28.0          # corners up to this are chamfered; sharper ones kept as genuine t...
  corner_chamfer_dist_m:         0.5         
  corner_min_runup_m:            0.6           # Dynamics-aware replan: replan when the follower's PREDICTED stop...
