topics:
  - topic: /xtend/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: best_effort     # confirm with `ros2 topic info -v /xtend/camera_info`
      durability: volatile

  # Depth/RGB are no longer bridged as raw Images. The drone saves each
  # frame to disk and publishes a tiny std_msgs/String "<path> <sec> <nsec>"
  # instead; the ROS1 consumers (mapping_sync, navdp_click) load the .npy /
  # .jpg from the path and reuse the (localization-synchronized) stamp. This
  # cuts the per-frame serialization/network cost of the image transport.
  - topic: /xtend/depth_frame_path
    type: std_msgs/msg/String
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      # best_effort matches the drone's publisher. With reliable here,
      # no data flows (this was the bug).
      reliability: best_effort
      durability: volatile

  - topic: /xtend/rgb_frame_path
    type: std_msgs/msg/String
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      # Same QoS as /xtend/depth_frame_path — a high-rate sensor stream from
      # the same camera, drops are fine. If `ros2 topic info -v
      # /xtend/rgb_frame_path` shows the publisher as reliable, flip this to
      # reliable (mismatch = no data flows, same trap as depth).
      reliability: best_effort
      durability: volatile
  # camera_info intentionally NOT bridged. Intrinsics are static and
  # already loaded into rosparam on the ROS1 side via
  #   /uav_model/sensing_parameters/camera_intrinsics/{fx,fy,cx,cy}
  #   /uav_model/sensing_parameters/{image_width,image_height,min_depth,max_depth}
  # FALCON's exploration_node reads intrinsics from rosparam, not from
  # the topic, so there's no reason to drag /xtend/camera_info across.
  # If you ever need it back, re-add the entry here AND set
  # bridge_camera_info:=true on the ROS1 sensor_gate.

  # ============== ROBOTICAN FIX ==============
  # Purely additive block below: new /R1/* entries only, no existing
  # /xtend/* entry above was touched, so an XTEND/Jetson bridge run
  # (bridge_topic.yaml or this file) bridges exactly what it always did.
  # ── ROBOTICAN/Sphera (Rooster "R1") ────────────────────────────────
  # Same frame-path transport as XTEND, just published under /R1/* by
  # run_rooster_frame_dir_publisher.sh + run_depth_processor.sh instead of
  # /xtend/*. Launch FALCON's real_drone.launch with real_depth_path_topic:=
  # /R1/depth_frame_path real_rgb_path_topic:=/R1/rgb_frame_path
  # real_pose_topic:=/R1/localization to match. Requires the bridge run with
  # ROS_DOMAIN_ID=6 RMW_IMPLEMENTATION=rmw_cyclonedds_cpp (Rooster is Jazzy/
  # CycloneDDS, not Foxy/FastRTPS like XTEND) — see run_bridge.sh.
  - topic: /R1/depth_frame_path
    type: std_msgs/msg/String
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: best_effort
      durability: volatile

  - topic: /R1/rgb_frame_path
    type: std_msgs/msg/String
    queue_size: 1
    qos:
      history: keep_last
      depth: 1
      reliability: best_effort
      durability: volatile

  - topic: /R1/localization
    type: geometry_msgs/msg/PoseStamped
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

#- topic: /flow_depth/pose_est
#  - topic: /xtend/amcl_pose
#  - topic: /flow_depth/pose_est
#    type: geometry_msgs/msg/PoseStamped
#    queue_size: 10
#    qos:
#      history: keep_last
#      depth: 10
#      # Per your QoSProfile snippet: best_effort. If pose is published
#      # reliable on the drone, change this to reliable and the depth
#      # to a higher number (50) for catch-up after stalls.
#      reliability: best_effort
#      durability: volatile

  - topic: /xtend/localization
    type: geometry_msgs/msg/PoseStamped
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      # Per your QoSProfile snippet: best_effort. If pose is published
      # reliable on the drone, change this to reliable and the depth
      # to a higher number (50) for catch-up after stalls.
      reliability: best_effort
      durability: volatile

  # ── Localization quality (ROS2 localization_node -> ROS1 controller) ──
  # The pose above says WHERE; these four say HOW MUCH TO BELIEVE IT. All four are
  # published in the same callback as the pose, one set per camera frame, so a
  # consumer can pair them by arrival without matching stamps.
  #
  # The drift_pid controller consumes all four: it flies slower when the pose is
  # vague, freezes its drift-learning integrators when the pose is a guess rather
  # than a measurement, and uses cmd_effectiveness as a second opinion on whether
  # its commands are reaching the world at all.
  #
  # Two traps worth writing down, because both are silent:
  #   * SILENCE IS A SIGNAL. A rejected frame, an exhausted coast budget, or a
  #     non-AprilTag provider all publish NOTHING. Never assume these tick; the
  #     controller runs its own arrival-age watchdog.
  #   * localization_source is the ONLY machine-readable "this pose is dead
  #     reckoning" flag ("apriltag_coast"). Confidence cannot substitute: a coasted
  #     pose caps at 0.25 and a genuine single-tag fix caps near 0.21, so the two
  #     are numerically indistinguishable.
  # QoS matches the publisher (best_effort/volatile); a mismatch means no data
  # flows at all, which is the same trap the depth topic hit.

  - topic: /xtend/localization_confidence
    type: std_msgs/msg/Float32
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

  - topic: /xtend/localization_pos_std
    type: std_msgs/msg/Float32
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

  - topic: /xtend/localization_cmd_effectiveness
    type: std_msgs/msg/Float32
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

  - topic: /xtend/localization_source
    type: std_msgs/msg/String
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: best_effort
      durability: volatile

  # The drone's own compass/IMU heading (radians), published by the XTEND
  # WebSocket bridge at ~20 Hz. Bridged for the lost-localization recovery: it is
  # the ONLY yaw source that does not come from AprilTag, and AprilTag is exactly
  # what is dead when the recovery runs. Without it the recovery's 360 sweep has
  # no feedback and can only run open-loop against an uncalibrated turn rate.
  # Nothing else consumes it, so dropping this entry degrades the sweep rather
  # than breaking the stack.
  - topic: /xtend/bearing
    type: std_msgs/msg/Float32
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      # Matches the drone-side publisher (a high-rate telemetry stream; drops are
      # fine — the recovery treats a bearing older than ~bearing_max_age_s as
      # absent and falls back to its timeout).
      reliability: best_effort
      durability: volatile

  - topic: /cmd_vel
    type: geometry_msgs/msg/Twist
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      # Control commands — reliable on the drone side. Scripts that
      # subscribe to /cmd_vel (like xtend_twist_to_cmd_nav.py) expect
      # reliable; best_effort here would cause a QoS mismatch.
      reliability: reliable
      durability: volatile

  # ── DemoMode state machine handshake ──────────────────────────────
  # Two String topics bridge the ROS2-owned DemoMode state machine to
  # the ROS1 Falcon planner. parameter_bridge bridges each entry in
  # both directions; the asymmetry below is purely about which side
  # is the authoritative publisher.
  #
  #   /xtend/demo_mode          published by ROS2 (system),
  #                             subscribed by ROS1 (waypoint_follower,
  #                             falcon_adapter). Current system state.
  #   /xtend/demo_mode_request  published by ROS1 (waypoint_follower)
  #                             to request a transition; consumed by
  #                             the ROS2 state-machine owner.
  #
  # Both use transient_local durability so a late-joining subscriber
  # (e.g. the bridge or Falcon restarting mid-flight) picks up the
  # last known state/request without waiting for the next publish.

  - topic: /xtend/demo_mode
    type: std_msgs/msg/String
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: transient_local

  - topic: /xtend/demo_mode_request
    type: std_msgs/msg/String
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: transient_local

  # ── Object-approach mission (ROS2 detector sidecar <-> ROS1 servo) ───
  # The TensorRT detector runs on the HOST as a ROS2 node (the Falcon container
  # has no CUDA/TensorRT/pycuda), so these two String topics carry the mission
  # across. No image is bridged: the detector reads /xtend/rgb_frame_path
  # natively on the ROS2 side and loads the JPEG off the host's disk.
  #
  #   /object_approach/detections  published by ROS2 (the detector sidecar),
  #                                subscribed by ROS1 (object_approach_node).
  #                                Detections JSON; see
  #                                core/common/detection_message.py.
  #   /object_approach/goal        the target object's label. Either side may
  #                                publish it (an operator's `rostopic pub` on
  #                                ROS1, or `ros2 topic pub` on ROS2); BOTH the
  #                                detector and object_approach_node subscribe.
  #
  # detections is a live stream at ~detect_hz: keep it shallow and volatile, and
  # never transient_local (a late joiner must not act on a stale box). goal is
  # transient_local so a detector or Falcon restarting mid-flight picks up the
  # current target without waiting for the operator to re-publish it.

  - topic: /object_approach/detections
    type: std_msgs/msg/String
    queue_size: 5
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile

  - topic: /object_approach/goal
    type: std_msgs/msg/String
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: transient_local

