# falcon_docker/docker-compose.yml
#
# Three profiles:
#
#   falcon-hospital   — x86_64 + Gazebo. BASE_IMAGE=osrf/ros:noetic-desktop-full.
#   falcon-jetson     — Jetson AGX. BASE_IMAGE=ros:noetic-perception (multiarch).
#   falcon-octa-maze  — x86_64. Same as hospital.
#
# The Dockerfile is the SAME for all three — only the BASE_IMAGE and
# WITH_SIM build-args differ. Image tag also differs so a Jetson image
# can't be confused with an x86 one on a shared registry.

services:

  # ── x86_64 + Gazebo (Hospital world) ──────────────────────
  falcon-hospital:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "osrf/ros:noetic-desktop-full"
        WITH_SIM: "1"
        # MAX_JOBS optional; default 4 is safe everywhere.
        MAX_JOBS: "8"
    image: falcon-ros:noetic
    container_name: falcon
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: bash

  # ── Jetson AGX (Orin / Xavier) — real-drone only ───────────
  # Build:  docker compose build falcon-jetson
  # Run:    docker compose run --rm falcon-jetson
  #
  # BASE_IMAGE=ros:noetic-perception has the arm64 manifest and
  # the perception ROS packages we need. osrf/ros:noetic-desktop-full
  # is amd64-only — using it on Jetson gives "exec format error".
  falcon-jetson:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "ros:noetic-perception"
        WITH_SIM: "0"
        # AGX Orin (12c/32G): 6 is fine. AGX Xavier (8c/32G): 4.
        # Drop to 2 if you see oom-kill in dmesg during build.
        MAX_JOBS: "4"
    image: falcon-ros:jetson
    container_name: falcon
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: bash

  # ── (Original) Octa-maze profile, x86_64 only ──────────────
  falcon-octa-maze:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "osrf/ros:noetic-desktop-full"
        WITH_SIM: "1"
        MAX_JOBS: "8"
    image: falcon-ros:noetic
    container_name: falcon-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: bash