# Start areas for InternVLA-N1 recordings in the SJTU Gazebo hospital.
#
# Five places to begin a flight, one per part of the building, so a campaign of
# recordings covers the hospital instead of five variations on the lobby. The
# aircraft is ferried to one of these above the walls by scripts/goto_area.py
# and the policy takes over from there.
#
# `clearance_m` is the distance to the nearest occupied cell, measured off the
# occupancy map rather than guessed -- it is in the file because a start pose
# 0.2 m from a wall is the difference between a recording and a collision, and
# it should be visible before the run rather than after it. Re-measure with:
#
#   .venv/bin/python sparx_agency/tasks/planning/sjtu_internvla_n1/scripts/area_clearance.py
#
# Measured against sparx_agency/robots/SJTU/maps/hospital.yaml -- the ground
# truth built from the world's own collision meshes over the 0.30-2.00 m band,
# so the numbers include the furniture the aircraft can actually hit, not just
# the walls.
#
# Frame: the Gazebo world frame /simple_drone/odom reports. x east, y north,
# yaw counter-clockwise from +x. The drone spawns at (1, 1) facing +x.

areas:
  atrium:
    x: -0.09
    y: 11.84
    yaw_deg: -90.0
    clearance_m: 4.11
    note: the open main hall north of the reception desk, facing back down the spine

  north_wing:
    x: -0.09
    y: 14.04
    yaw_deg: 90.0
    clearance_m: 3.01
    note: the north corridor, facing the far end of the building

  reception:
    x: 1.07
    y: 2.08
    yaw_deg: 90.0
    clearance_m: 1.54
    note: beside the curved reception desk, facing the atrium

  east_wards:
    x: 8.47
    y: -7.28
    yaw_deg: 180.0
    clearance_m: 1.75
    note: the east ward corridor, facing back across the building

  south_hall:
    x: -1.61
    y: -27.96
    yaw_deg: 90.0
    clearance_m: 1.85
    note: the south hall at the far end, facing the whole length of the hospital

  # THE "ENTER THE ROOM ON YOUR RIGHT" EXPERIMENT, and the second attempt at
  # siting it. The first start, at (-2.80, 1.40) facing east, was chosen from
  # the drone's camera because a door was plainly visible on the right -- and
  # that door is a CLOSED PANEL. Measured on the flight-band occupancy map:
  # clearance at the point it faces is 0.05 m. The office block's north side has
  # exactly two openings this airframe can pass, at x = -2.85 and x = +2.75, and
  # from that pose the nearer one lies at **92 degrees to the right**, outside a
  # 75-degree camera. The instruction was therefore true of the room and false
  # of anything the model could see, and ten flights across two campaigns
  # entered the room twice, both times by accident.
  #
  # From here the real opening is 4.4 m away and 26 degrees to the RIGHT --
  # inside the frame, standing open, floor visible through it. Verified from the
  # aircraft's own camera, not from the map.
  office_door:
    x: -5.00
    y: 3.60
    yaw_deg: -30.0
    clearance_m: 1.45
    note: the spine by the nurses' station, facing the open ward door on the right
    # GROUND TRUTH, measured off the world's collision meshes over the band a
    # drone at 1.20 m can hit (0.85-1.55 m), not the 0.30-2.00 m map: furniture
    # the aircraft flies over must not count as a wall.
    door_x: -2.85          # the opening, 0.96 m clear
    door_y: -0.22
    table_x: -1.27         # AdjTable, with an office chair and two pictures
    table_y: -5.69
    stand_off_x: -1.27     # where the aircraft can sit and see it
    stand_off_y: -5.09
    # The widest flyable line from here to that stand-off. 0.90 m for a 0.63 m
    # airframe: 0.13 m of margin, and the reason cruise_speed and lookahead_m
    # were lowered. It is tight on purpose -- it is the room the hospital has.
    route_m: 12.0
    bottleneck_m: 0.90
