# Start areas for InternVLA-N1 recordings in the SJTU Gazebo hospital.
#
# Five places to begin a flight, one per part of the building, so a campaign of
# recordings covers the hospital instead of five variations on the lobby. The
# aircraft is ferried to one of these above the walls by scripts/goto_area.py
# and the policy takes over from there.
#
# `clearance_m` is the distance to the nearest occupied cell, measured off the
# occupancy map rather than guessed -- it is in the file because a start pose
# 0.2 m from a wall is the difference between a recording and a collision, and
# it should be visible before the run rather than after it. Re-measure with:
#
#   .venv/bin/python sparx_agency/tasks/planning/sjtu_internvla_n1/scripts/area_clearance.py
#
# Measured against sparx_agency/robots/SJTU/maps/hospital.yaml -- the ground
# truth built from the world's own collision meshes over the 0.30-2.00 m band,
# so the numbers include the furniture the aircraft can actually hit, not just
# the walls.
#
# Frame: the Gazebo world frame /simple_drone/odom reports. x east, y north,
# yaw counter-clockwise from +x. The drone spawns at (1, 1) facing +x.

areas:
  atrium:
    x: -0.09
    y: 11.84
    yaw_deg: -90.0
    clearance_m: 4.11
    note: the open main hall north of the reception desk, facing back down the spine

  north_wing:
    x: -0.09
    y: 14.04
    yaw_deg: 90.0
    clearance_m: 3.01
    note: the north corridor, facing the far end of the building

  reception:
    x: 1.07
    y: 2.08
    yaw_deg: 90.0
    clearance_m: 1.54
    note: beside the curved reception desk, facing the atrium

  east_wards:
    x: 8.47
    y: -7.28
    yaw_deg: 180.0
    clearance_m: 1.75
    note: the east ward corridor, facing back across the building

  south_hall:
    x: -1.61
    y: -27.96
    yaw_deg: 90.0
    clearance_m: 1.85
    note: the south hall at the far end, facing the whole length of the hospital

  # Added for the "enter the room on your right" experiment, and verified from
  # the drone's own camera rather than from the map: standing here facing east,
  # the nurses' station is on the left and there is a **door on the right**
  # about three metres ahead, opening south into the office bay that holds the
  # desk, the chair and the AdjTable. The instruction is therefore true of what
  # the model can actually see, which is the only sense in which an instruction
  # can be true.
  office_door:
    x: -2.80
    y: 1.40
    yaw_deg: 0.0
    clearance_m: 1.40
    note: the spine outside the nurses' station, facing east with the office door on the right
    # GROUND TRUTH FOR JUDGING A RUN, measured off the occupancy map inflated by
    # the airframe radius. The office bay is entered through ONE opening, at
    # (2.70, -0.20) -- 5.7 m east of here and 16 deg off the right of the nose,
    # which is the door visible in the camera. The shortest flyable route to the
    # AdjTable at (1.22, -5.61) is 13.3 m: east along the spine, right through
    # that opening, then south. A run that turns right immediately is aiming at
    # the bay's north wall, not at its door.
    door_x: 2.70
    door_y: -0.20
    table_x: 1.22
    table_y: -5.61
    route_m: 13.3
