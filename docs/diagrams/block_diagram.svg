<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style type="text/css"><![CDATA[
      .title {font: bold 28px sans-serif; fill: #0b4f9d;}
      .subtitle {font: bold 22px sans-serif; fill: #0b4f9d;}
      .label {font: 18px sans-serif; fill: #222;}
      .small {font: 14px sans-serif; fill: #333;}
      .box {fill: #f5f8ff; stroke: #0b4f9d; stroke-width: 2;}
      .group {fill: #ffffff; stroke: #888; stroke-width: 2;}
      .core {fill: #eef6ff; stroke: #1d6fd3; stroke-width: 3;}
      .demos {fill: #fee6ee; stroke: #1d6fd3; stroke-width: 3;}
      .task {fill: #fff7e6; stroke: #d47f00; stroke-width: 2;}
      .robot {fill: #9f99e0; stroke: #ff7f99; stroke-width: 2;}
      .arrow {stroke: #444; stroke-width: 2; marker-end: url(#arrowhead);}
      .dashed {stroke-dasharray: 6 6;}
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444" />
    </marker>
  </defs>

  <!-- Diagram title -->
  <text x="600" y="50" text-anchor="middle" class="title">Robotics Package Architecture</text>

  <!-- CORE group -->
  <rect x="100" y="120" width="550" height="360" rx="12" class="group" />
  <text x="375" y="155" text-anchor="middle" class="subtitle">Core</text>
  <text x="375" y="185" text-anchor="middle" class="small">Algorithms &amp; Services</text>

  <!-- Mapping block -->
  <rect x="130" y="220" width="240" height="100" rx="10" class="box" />
  <text x="250" y="265" text-anchor="middle" class="label">Mapping</text>
  <text x="250" y="292" text-anchor="middle" class="small">SLAM / Occupancy Grid / 3D Map</text>

  <!-- Localization block -->
  <rect x="380" y="220" width="240" height="100" rx="10" class="box" />
  <text x="500" y="265" text-anchor="middle" class="label">Localization</text>
  <text x="500" y="292" text-anchor="middle" class="small">Pose Estimation / Sensor Fusion</text>

  <!-- Planning block -->
  <rect x="255" y="340" width="240" height="100" rx="10" class="box" />
  <text x="375" y="385" text-anchor="middle" class="label">Planning</text>
  <text x="375" y="412" text-anchor="middle" class="small">Global &amp; Local Path / Task Planning</text>

  <!-- Shared interfaces (optional depiction) -->
